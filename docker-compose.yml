services:
  customankimaps:
    build: .
    image: ghcr.io/beclay-vps/customankimaps:latest
    container_name: customankimaps
    ports:
      - "8000:8000"
    restart: always
    environment:
      - PORT=8000
      - UMAMI_SCRIPT_URL=${UMAMI_SCRIPT_URL:-https://stats.beclay.fr/script.js}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
    networks:
      - web
    labels:
      - "traefik.enable=true"
      # Remplacez custommaps.beclay.fr par votre domaine/sous-domaine souhaité
      - "traefik.http.routers.customankimaps.rule=Host(`custommaps.beclay.fr`)"
      - "traefik.http.routers.customankimaps.entrypoints=websecure"
      - "traefik.http.routers.customankimaps.tls.certresolver=le"
      # FastAPI écoute sur le port 8000 dans le conteneur
      - "traefik.http.services.customankimaps.loadbalancer.server.port=8000"

networks:
  web:
    name: web
